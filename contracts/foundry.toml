# SPDX-License-Identifier: Apache-2.0
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Our sources pin solc 0.8.28; the T-REX and ONCHAINID dependencies pin 0.8.17.
# Each compilation unit is built with the version its pragmas require.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
# The QoreChain EVM Engine has Shanghai, Cancun and Prague active (Osaka is not).
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"

[fmt]
line_length = 120
