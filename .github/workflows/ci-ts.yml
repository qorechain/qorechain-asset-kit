# SPDX-License-Identifier: Apache-2.0
name: ci-ts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: NOTICE copies match the repository NOTICE
        run: |
          cmp NOTICE clients/ts/NOTICE
          cmp NOTICE clients/python/NOTICE
          cmp NOTICE packages/issuer-console/public/NOTICE
          cmp LICENSE clients/ts/LICENSE
          cmp LICENSE clients/python/LICENSE
      - name: No source maps in published bundles
        run: test -z "$(find clients/ts/dist packages/issuer-console/dist -name '*.map' 2>/dev/null)"
