version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Cosmos SDK convention: services are named Msg and Query.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
